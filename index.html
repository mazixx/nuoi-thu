    .yellow-btn {

        background: radial-gradient(circle at 35% 30%, #fff275, #f1c40f 55%, #c29d0b 100%);
        border: 3px solid #062a70;
        box-shadow: 0 5px 0 #041b47, 0 7px 10px rgba(0,0,0,0.5);

    .btn-label {

    /* Định vị vòng cung cho 4 nút giống y hệt ảnh chụp */

<script>
// ================= HỆ THỐNG ÂM THANH 8-BIT BEEP (WEB AUDIO API) =================
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;

function beep(freq = 1200, duration = 0.06, type = "square", delay = 0) {
    try {
        if (!audioCtx) audioCtx = new AudioCtx();
        if (audioCtx.state === "suspended") audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime + delay);
        gain.gain.setValueAtTime(0.08, audioCtx.currentTime + delay);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + delay + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(audioCtx.currentTime + delay);
        osc.stop(audioCtx.currentTime + delay + duration);
    } catch (e) {}
}

function sfxSelect() { beep(1400, 0.045); }
function sfxDecide() { beep(1600, 0.05, "square", 0); beep(2100, 0.07, "square", 0.06); }
function sfxCancel() { beep(900, 0.06); }
function sfxHappy()  { [1300, 1600, 2000, 2400].forEach((f, i) => beep(f, 0.07, "square", i * 0.08)); }
function sfxSad()    { [1000, 800, 600].forEach((f, i) => beep(f, 0.12, "sawtooth", i * 0.14)); }

// ================= CẤU HÌNH MÀN HÌNH MA TRẬN ĐIỂM ẢNH (LCD 32x24) =================
const canvas = document.getElementById("lcd");
const ctx = canvas.getContext("2d");
const COLS = 32, ROWS = 20; // Vùng ma trận pixel ở giữa
const PX = 5;               // Kích thước mỗi chấm pixel = 5x5
const OFFSET_Y = 22;        // Dành 22px trên và 22px dưới cho thanh Icon cố định

const COLOR_BG = "#879676";       // Xanh rêu LCD cổ điển
const COLOR_PIXEL_OFF = "#7d8c6d";// Bóng mờ của điểm ảnh khi tắt
const COLOR_PIXEL_ON = "#1c2418"; // Màu mực đen tinh thể lỏng khi bật

// ================= SPRITES PIXEL ART (MA TRẬN 16x13) =================
// Đặc biệt: ADULT_SPRITE_1 & 2 được vẽ chính xác 100% theo hình chụp chiếc máy của bạn!
const SPRITES = {

    ],
    BABY_1: [

        "...11......11...",
        ".....111111.....",

    ],
    // HÌNH THÚ TRƯỞNG THÀNH Y HỆT TRONG ẢNH CHỤP (Có râu chữ V, 2 cánh vẫy 2 bên, mỏ cười)
    ADULT_1: [

        "....11111111....",

    ],

    ],

        ".11..11.",
        "1..11..1"
    ]
};

// Danh sách 7 Icon trên và dưới màn hình
const MENU_ICONS = [
    { name: "CHỈ SỐ", icon: "📊" },
    { name: "CHO ĂN", icon: "🍙" },
    { name: "ĐÈN NGỦ", icon: "💡" },
    { name: "TRÒ CHƠI", icon: "🎮" },
    { name: "THUỐC",   icon: "💉" },
    { name: "DỌN PHÂN",icon: "🚽" },
    { name: "KHEN NGỢI",icon: "📣" }
];

// ================= TRẠNG THÁI CỦA THÚ ẢO =================
let pet = {
    stage: 2,          // Mặc định mở lên là con thú có cánh giống ảnh (0:Trứng, 1:Nhỏ, 2:Có cánh, 3:Khủng long)
    age: 3,
    weight: 18,
    hunger: 3,         // Tối đa 4 tim
    happy: 3,          // Tối đa 4 tim
    poops: 1,          // Số cục phân trên màn hình
    isSick: false,
    lightsOn: true,
    x: 8,              // Vị trí X trên lưới 32 cột
    dir: 1
};

let ui = {
    selectedIcon: -1,  // -1: Chưa chọn, 0..6: Các icon
    mode: "IDLE",      // IDLE, STATUS, FEED_MENU, EATING, FLUSHING, GAME, HEALING, PRAISE
    subPage: 0,
    foodChoice: 0,     // 0: Cơm, 1: Kẹo
    animTick: 0,
    flushX: 32,
    gameTarget: 0,     // 0: Trái, 1: Phải
    gameResult: "",
    emotionUntil: 0    // Thời gian thú nhảy mừng
};

// ================= XỬ LÝ 4 NÚT BẤM VẬT LÝ =================
function flashBtn(id) {
    const b = document.getElementById(id);
    if (!b) return;
    b.classList.add("pressed");
    setTimeout(() => b.classList.remove("pressed"), 120);
}

// Nút 2: SELECT (Di chuyển vệt sáng qua các Icon hoặc đổi lựa chọn)
function pressSelect() {
    flashBtn("btn-a");
    sfxSelect();

    if (ui.mode === "IDLE") {
        ui.selectedIcon = (ui.selectedIcon + 1) % MENU_ICONS.length;
    } else if (ui.mode === "STATUS") {
        ui.subPage = (ui.subPage + 1) % 3;
    } else if (ui.mode === "FEED_MENU") {
        ui.foodChoice = 1 - ui.foodChoice;
    } else if (ui.mode === "GAME" && !ui.gameResult) {
        playGuessGame(0); // Chọn Trái
    }
}

// Nút 3: DECIDE (Xác nhận chọn mục đang sáng)
function pressDecide() {
    flashBtn("btn-b");

    if (ui.mode === "IDLE") {
        if (ui.selectedIcon === -1) {
            ui.selectedIcon = 0;
            sfxSelect();
            return;
        }
        sfxDecide();
        openMenuAction(ui.selectedIcon);
    } else if (ui.mode === "STATUS") {
        sfxSelect();
        ui.subPage = (ui.subPage + 1) % 3;
    } else if (ui.mode === "FEED_MENU") {
        startEating(ui.foodChoice);
    } else if (ui.mode === "GAME") {
        if (!ui.gameResult) {
            playGuessGame(1); // Chọn Phải
        } else {
            // Chơi ván tiếp theo
            ui.gameResult = "";
            sfxSelect();
        }
    }
}

// Nút 4: CANCEL (Thoát ra màn hình chính)
function pressCancel() {
    flashBtn("btn-c");
    sfxCancel();
    if (ui.mode === "IDLE") {
        ui.selectedIcon = -1;
    } else {
        ui.mode = "IDLE";
    }
}

// Nút 1: RESET (Đổi hình dạng tiến hóa hoặc nuôi lại)
function pressReset() {
    flashBtn("btn-r");
    sfxHappy();
    pet.stage = (pet.stage + 1) % 4;
    if (pet.stage === 0) {
        // Khi về trứng thì khôi phục đầy đủ chỉ số
        pet.hunger = 4; pet.happy = 4; pet.poops = 0; pet.isSick = false; pet.lightsOn = true;
    }
    ui.mode = "IDLE";
}

// ================= CÁC HÀNH ĐỘNG CHĂM SÓC THÚ =================
function openMenuAction(idx) {
    if (!pet.lightsOn && idx !== 2 && idx !== 0) {
        // Đang tắt đèn ngủ thì không cho ăn hay chơi
        sfxSad();
        return;
    }
    switch (idx) {
        case 0: // Xem chỉ số
            ui.mode = "STATUS";
            ui.subPage = 0;
            break;
        case 1: // Cho ăn
            ui.mode = "FEED_MENU";
            ui.foodChoice = 0;
            break;
        case 2: // Bật / Tắt đèn ngủ
            pet.lightsOn = !pet.lightsOn;
            ui.mode = "IDLE";
            break;
        case 3: // Chơi mini-game đoán hướng
            ui.mode = "GAME";
            ui.gameResult = "";
            break;
        case 4: // Tiêm thuốc chữa bệnh
            ui.mode = "HEALING";
            pet.isSick = false;
            pet.happy = Math.min(4, pet.happy + 1);
            sfxHappy();
            setTimeout(() => { if (ui.mode === "HEALING") ui.mode = "IDLE"; }, 1800);
            break;
        case 5: // Dọn phân (Sóng nước xả bồn cầu)
            ui.mode = "FLUSHING";
            ui.flushX = 32;
            break;
        case 6: // Huấn luyện / Khen ngợi
            ui.mode = "PRAISE";
            pet.happy = Math.min(4, pet.happy + 1);
            sfxHappy();
            setTimeout(() => { if (ui.mode === "PRAISE") ui.mode = "IDLE"; }, 1800);
            break;
    }
}

function startEating(choice) {
    ui.mode = "EATING";
    sfxHappy();
    if (choice === 0) { // Ăn cơm nắm
        pet.hunger = Math.min(4, pet.hunger + 1);
        pet.weight += 2;
    } else {            // Ăn kẹo
        pet.happy = Math.min(4, pet.happy + 1);
        pet.weight += 1;
    }
    setTimeout(() => {
        if (ui.mode === "EATING") {
            ui.mode = "IDLE";
            ui.emotionUntil = Date.now() + 2000;
        }
    }, 1800);
}

function playGuessGame(userDir) {
    ui.gameTarget = Math.random() < 0.5 ? 0 : 1;
    if (userDir === ui.gameTarget) {
        ui.gameResult = "WIN";
        pet.happy = Math.min(4, pet.happy + 1);
        pet.weight = Math.max(5, pet.weight - 1);
        sfxHappy();
    } else {
        ui.gameResult = "LOSE";
        sfxSad();
    }
}

// Điều khiển bàn phím máy tính.
window.addEventListener("keydown", event => {
    const active = document.activeElement;

    if (
        active
        && (
            active.matches("input, textarea, select")
            || active.isContentEditable
        )
    ) {
        return;
    }

    // Khi nút HTML đang được chọn, để trình duyệt xử lý
    // Enter/Space, tránh vừa click nút vừa chạy phím game.
    if (
        active
        && active.tagName === "BUTTON"
        && (event.key === "Enter" || event.code === "Space")
    ) {
        return;
    }

    const key = event.key.toLowerCase();

    const supported = [
        "a", "arrowleft", "arrowright",
        "s", "enter", " ",
        "d", "escape", "backspace",
        "r"
    ];

    if (!supported.includes(key)) {
        return;
    }

    event.preventDefault();

    // Giữ phím không tự lặp nhiều thao tác.
    if (event.repeat) {
        return;
    }

    if (["a", "arrowleft", "arrowright"].includes(key)) {
        pressSelect();
    } else if (["s", "enter", " "].includes(key)) {
        pressDecide();
    } else if (["d", "escape", "backspace"].includes(key)) {
        pressCancel();
    } else if (key === "r") {
        pressReset();
    }
});
// ================= HÀM VẼ ĐIỂM ẢNH MA TRẬN LCD =================
function setPixel(gx, gy, on = true) {
    if (gx < 0 || gx >= COLS || gy < 0 || gy >= ROWS) return;
    ctx.fillStyle = on ? COLOR_PIXEL_ON : COLOR_PIXEL_OFF;
    ctx.fillRect(gx * PX + 0.5, OFFSET_Y + gy * PX + 0.5, PX - 1, PX - 1);
}

function drawSprite(spriteArr, startX, startY, flipX = false) {
    for (let r = 0; r < spriteArr.length; r++) {
        let rowStr = spriteArr[r];
        for (let c = 0; c < rowStr.length; c++) {
            if (rowStr[c] === "1") {
                let drawCol = flipX ? (rowStr.length - 1 - c) : c;
                setPixel(startX + drawCol, startY + r, true);
            }
        }
    }
}

function drawLCDText(text, x, y, size = 10) {
    ctx.fillStyle = COLOR_PIXEL_ON;
    ctx.font = `bold ${size}px 'Courier New', monospace`;
    ctx.fillText(text, x, y);
}

// ================= VÒNG LẶP VẼ MÀN HÌNH CHÍNH =================
function renderLCD() {
    // 1. Nền màn hình LCD xanh rêu
    ctx.fillStyle = COLOR_BG;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // 2. Vẽ thanh 7 Icon trên & dưới
    ctx.font = "12px Arial";
    ctx.textAlign = "center";
    for (let i = 0; i < MENU_ICONS.length; i++) {
        let isTop = i < 4;
        let ix = isTop ? (22 + i * 38) : (32 + (i - 4) * 46);
        let iy = isTop ? 15 : 138;

        if (ui.selectedIcon === i) {
            ctx.fillStyle = COLOR_PIXEL_ON;
            ctx.fillRect(ix - 12, iy - 12, 24, 15);
            ctx.fillStyle = COLOR_BG;
        } else {
            ctx.globalAlpha = 0.35;
            ctx.fillStyle = COLOR_PIXEL_ON;
        }
        ctx.fillText(MENU_ICONS[i].icon, ix, iy);
        ctx.globalAlpha = 1.0;
    }

    // 3. Kẻ khung lưới điểm ảnh mờ (Tạo hiệu ứng LCD thật)
    for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
            setPixel(c, r, false);
        }
    }

    // 4. Nếu đang TẮT ĐÈN NGỦ
    if (!pet.lightsOn && ui.mode === "IDLE") {
        for (let r = 0; r < ROWS; r++) {
            for (let c = 0; c < COLS; c++) {
                if ((r + c) % 2 === 0) setPixel(c, r, true);
            }
        }
        ctx.fillStyle = COLOR_BG;
        ctx.fillRect(45, 48, 70, 32);
        drawLCDText("Z z z...", 52, 68, 12);
        return;
    }

    // 5. Vẽ theo từng Chế độ (Mode)
    let frameToggle = Math.floor(ui.animTick / 25) % 2 === 0;

    if (ui.mode === "IDLE") {
        // Vẽ thú cưng theo giai đoạn
        let sp = SPRITES.ADULT_1;
        if (pet.stage === 0) sp = SPRITES.EGG_1;
        else if (pet.stage === 1) sp = SPRITES.BABY_1;
        else if (pet.stage === 2) sp = frameToggle ? SPRITES.ADULT_1 : SPRITES.ADULT_2;
        else if (pet.stage === 3) sp = SPRITES.DINO_1;

        let bounceY = (Date.now() < ui.emotionUntil) ? (frameToggle ? 1 : 4) : (frameToggle ? 3 : 4);
        drawSprite(sp, pet.x, bounceY, pet.dir === -1);

        // Vẽ cục phân nếu có (bên góc phải)
        for (let p = 0; p < pet.poops; p++) {
            drawSprite(SPRITES.POOP, 25, 13 - p * 6, false);
        }

        // Vẽ biểu tượng đầu lâu nếu bị ốm
        if (pet.isSick && frameToggle) {
            drawSprite(SPRITES.SKULL, 2, 2, false);
        }

    } else if (ui.mode === "STATUS") {
        ctx.textAlign = "left";
        if (ui.subPage === 0) {
            drawLCDText("ĐỘ NO (HUNGRY)", 12, 42, 11);
            drawLCDText("♥ ".repeat(pet.hunger) + "♡ ".repeat(4 - pet.hunger), 24, 65, 16);
            drawLCDText("[SELECT: Tiếp]", 30, 105, 10);
        } else if (ui.subPage === 1) {
            drawLCDText("ĐỘ VUI (HAPPY)", 12, 42, 11);
            drawLCDText("♥ ".repeat(pet.happy) + "♡ ".repeat(4 - pet.happy), 24, 65, 16);
            drawLCDText("[SELECT: Tiếp]", 30, 105, 10);
        } else {
            drawLCDText(`TUỔI  : ${pet.age} Năm`, 16, 48, 12);
            drawLCDText(`NẶNG  : ${pet.weight} Gram`, 16, 72, 12);
            drawLCDText(`LOÀI  : Cấp ${pet.stage + 1}/4`, 16, 96, 12);
        }

    } else if (ui.mode === "FEED_MENU") {
        ctx.textAlign = "left";
        drawLCDText("CHỌN THỨC ĂN:", 18, 42, 11);
        drawLCDText(`${ui.foodChoice === 0 ? "▶" : " "} CƠM NẮM (+No)`, 16, 68, 12);
        drawLCDText(`${ui.foodChoice === 1 ? "▶" : " "} KẸO NGỌT (+Vui)`, 16, 92, 12);

    } else if (ui.mode === "EATING") {
        let foodSp = ui.foodChoice === 0 ? SPRITES.RICE : SPRITES.CANDY;
        drawSprite(foodSp, 4, 6, false);
        drawSprite(frameToggle ? SPRITES.ADULT_1 : SPRITES.ADULT_2, 13, 3, false);
        ctx.textAlign = "center";
        drawLCDText("Măm măm... Ngon!", 80, 112, 11);

    } else if (ui.mode === "FLUSHING") {
        // Sóng nước quét ngang màn hình dọn sạch phân
        for (let r = 2; r < ROWS - 2; r++) {
            let waveCol = ui.flushX + (r % 2);
            setPixel(waveCol, r, true);
            setPixel(waveCol + 1, r, true);
        }

    } else if (ui.mode === "GAME") {
        ctx.textAlign = "center";
        if (!ui.gameResult) {
            drawLCDText("ĐOÁN HƯỚNG QUAY!", 80, 38, 11);
            drawSprite(SPRITES.ADULT_1, 8, 4, false);
            drawLCDText("SELECT=Trái | DECIDE=Phải", 80, 114, 9);
        } else {
            drawSprite(SPRITES.ADULT_2, 8, 3, ui.gameTarget === 1);
            drawLCDText(ui.gameResult === "WIN" ? "🎉 THẮNG RỒI! (+1 Vui)" : "💦 ĐOÁN SAI RỒI!", 80, 100, 11);
            drawLCDText("[DECIDE: Chơi tiếp]", 80, 115, 9);
        }

    } else if (ui.mode === "HEALING") {
        drawSprite(SPRITES.ADULT_2, 8, 3, false);
        ctx.textAlign = "center";
        drawLCDText("💉 Đã tiêm thuốc khỏe!", 80, 112, 11);

    } else if (ui.mode === "PRAISE") {
        drawSprite(SPRITES.ADULT_2, 8, frameToggle ? 2 : 4, false);
        ctx.textAlign = "center";
        drawLCDText("❤️ Thú rất ngoan! (+Vui)", 80, 112, 11);
    }
}

/* ===== LOGIC CỐ ĐỊNH 60 NHỊP/GIÂY ===== */

function updateLogic() {
    ui.animTick++;

    // Thú tự đi lại khi thức và không còn ở giai đoạn trứng.
    if (
        ui.mode === "IDLE"
        && pet.lightsOn
        && pet.stage > 0
        && ui.animTick % 45 === 0
    ) {
        pet.x += pet.dir;

        if (pet.x > 12) {
            pet.x = 12;
            pet.dir = -1;
        }

        if (pet.x < 3) {
            pet.x = 3;
            pet.dir = 1;
        }
    }

    // Hiệu ứng dọn phân.
    if (
        ui.mode === "FLUSHING"
        && ui.animTick % 2 === 0
    ) {
        ui.flushX -= 2;

        beep(
            600 + ui.flushX * 25,
            0.02,
            "triangle"
        );

        if (ui.flushX < -2) {
            pet.poops = 0;
            ui.mode = "IDLE";
            ui.emotionUntil = Date.now() + 2000;

            sfxHappy();
        }
    }

    // Chu kỳ chăm sóc khoảng 15 giây khi tab hoạt động.
    if (ui.animTick % 900 === 0) {
        if (pet.hunger > 0) {
            pet.hunger--;
        }

        if (pet.happy > 0 && Math.random() < 0.5) {
            pet.happy--;
        }

        if (pet.poops < 2 && Math.random() < 0.45) {
            pet.poops++;
            beep(500, 0.1, "sawtooth");
        }

        if (pet.poops >= 2) {
            pet.isSick = true;
        }
    }
}

const LOGIC_STEP = 1 / 60;

let previousFrame = performance.now();
let accumulatedTime = 0;

function gameLoop(now) {
    const elapsed = Math.max(
        0,
        Math.min((now - previousFrame) / 1000, 0.1)
    );

    previousFrame = now;

    if (document.hidden) {
        accumulatedTime = 0;
        requestAnimationFrame(gameLoop);
        return;
    }

    accumulatedTime += elapsed;

    while (accumulatedTime >= LOGIC_STEP) {
        updateLogic();
        accumulatedTime -= LOGIC_STEP;
    }

    renderLCD();
    requestAnimationFrame(gameLoop);
}

document.addEventListener("visibilitychange", () => {
    previousFrame = performance.now();
    accumulatedTime = 0;
});

requestAnimationFrame(gameLoop);
</script>
